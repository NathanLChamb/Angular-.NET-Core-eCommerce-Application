<figure>
    <figcaption>Manage Orders</figcaption>
    <table>
        <caption>
            <div>
                <button type="button"
                    [class.active]="filter().status === OrderStatusFilter.All"
                    (click)="setStatus(OrderStatusFilter.All)">
                    All</button>
                <button type="button"
                    [class.active]="filter().status === OrderStatusFilter.Working"
                    (click)="setStatus(OrderStatusFilter.Working)">
                    Working</button>
                <button type="button"
                    [class.active]="filter().status === OrderStatusFilter.Completed"
                    (click)="setStatus(OrderStatusFilter.Completed)">
                    Completed</button>
                <button type="button"
                    [class.active]="filter().status === OrderStatusFilter.Cancelled"
                    (click)="setStatus(OrderStatusFilter.Cancelled)">
                    Cancelled</button></div>
                <div>
                    <input type="search" placeholder="Search..." /></div></caption>
        <thead>
            <tr>
                <th id="hdr_created" scope="col">Created</th>
                <th id="hdr_order" scope="col">Order</th>
                <th id="hdr_sku" scope="col">Sku</th>
                <th id="hdr_quantity" scope="col">Quantity</th>
                <th id="hdr_status" scope="col">Status</th></tr></thead>
        <tbody>
            @if (orders.isLoading()) {
                <tr>
                    <td>Loading...</td></tr>
            }
            @if (orders.value(); as result) {
                @for (order of orders.value()?.items ?? []; track order.id) {                   
                    @for (item of order.items; track $index) {
                        <tr>
                            <td headers="hdr_created">{{order.orderDate | date:'short'}}</td>
                            <td headers="hdr_order">
                                <a class="order-link" [routerLink]="['/orders/admin', order.id]">{{order.orderNumber}}</a></td>
                            <td headers="hdr_sku">{{item.sku}}</td>
                            <td headers="hdr_quantity">{{item.quantity}}</td>
                            <td headers="hdr_status">
                                <select [value]="order.status" (change)="updateStatus(order.id, +$any($event.target).value)">
                                    @for(status of statuses; track status.value) {
                                        <option [value]="status.value">{{status.label}}</option>
                                    }</select></td></tr>
                    }
                }
            }
        </tbody>
    </table>
    <div class="buttons">
        <button (click)="previousPage()" [disabled]="pageNumber() === 1">Previous</button>
        <span>Page {{pageNumber()}} of {{totalPages()}}</span>
        <button (click)="nextPage()" [disabled]="pageNumber() === totalPages()">Next</button>
    </div>
</figure>
