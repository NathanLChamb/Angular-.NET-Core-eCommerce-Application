<form [formGroup]="form" (ngSubmit)="onSubmit()">
    <h2>{{isEditMode() ? "Edit Category" : "Create Category"}}</h2>
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" formControlName="name" maxlength="50" autofocus/>
            @if (name.invalid && (name.dirty || name.touched)) {
                <div>
                    @if (name.hasError('required')) {
                        <small>Name is required</small>
                    }
                    @if (name.hasError('maxlength')) {
                        <small>Name must be less than 50 characters long</small>
                    }</div>
            }</div>

    <button type="submit" [disabled]="form.invalid || category.isLoading()">Submit</button>
</form>
