<div class="login-page">
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <h2>Login</h2>
    <div>
      <label>Email</label>
      <input type="email" formControlName="email"></div>

    <div>
      <label>Password</label>
      <input type="password" formControlName="password"></div>

    @if (errorMessage) {
      <p class="error">{{ errorMessage }} </p>
    }

    <button type="submit" [disabled]="loginForm.invalid">Login</button>
  </form>
</div>

<div class="demo-access">
    <div class="demo-text">
        <h3>Demo Access</h3>
        <p>Use the demo accounts below:</p>
        <p>- Customer account — view storefront features</p>
        <p>- Admin account — manage products and options</p>
        <p>Credentials are available in the project README.</p>
    </div>
</div>
